<svg width="1200" height="400" viewBox="0 0 1200 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#090D16"/>
      <stop offset="1" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1200" height="400" rx="24" fill="url(#bg)"/>
  <rect x="1.5" y="1.5" width="1197" height="397" rx="22.5" stroke="url(#grad)" stroke-width="2" stroke-opacity="0.35"/>

  <!-- Blueprint Grid Pattern -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="400" stroke-dasharray="4 8"/>
    <line x1="250" y1="0" x2="250" y2="400" stroke-dasharray="4 8"/>
    <line x1="400" y1="0" x2="400" y2="400" stroke-dasharray="4 8"/>
    <line x1="550" y1="0" x2="550" y2="400" stroke-dasharray="4 8"/>
    <line x1="700" y1="0" x2="700" y2="400" stroke-dasharray="4 8"/>
    <line x1="850" y1="0" x2="850" y2="400" stroke-dasharray="4 8"/>
    <line x1="1000" y1="0" x2="1000" y2="400" stroke-dasharray="4 8"/>
    <line x1="1150" y1="0" x2="1150" y2="400" stroke-dasharray="4 8"/>
    <line x1="0" y1="100" x2="1200" y2="100" stroke-dasharray="4 8"/>
    <line x1="0" y1="200" x2="1200" y2="200" stroke-dasharray="4 8"/>
    <line x1="0" y1="300" x2="1200" y2="300" stroke-dasharray="4 8"/>
  </g>

  <!-- Ambient Glow -->
  <circle cx="1020" cy="180" r="140" fill="url(#grad)" opacity="0.12" filter="url(#glow)"/>
  <circle cx="200" cy="320" r="90" fill="url(#accent)" opacity="0.08" filter="url(#glow)"/>

  <!-- Badge Pill -->
  <g transform="translate(80, 80)">
    <rect width="420" height="36" rx="18" fill="#1E293B" stroke="url(#grad)" stroke-width="1"/>
    <circle cx="20" cy="18" r="6" fill="#F59E0B"/>
    <text x="36" y="23" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">CONSTRUCTION CONTRACTING ERP &amp; ESTIMATION</text>
  </g>

  <!-- Title & Subtitle -->
  <text x="80" y="185" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="46" font-weight="800" letter-spacing="-0.5">KAL SAYEGH DASHBOARD</text>
  <text x="80" y="235" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="20" font-weight="400">Next.js 15 App Router · Gantt Project Schedules · Line-Item Cost Estimation · Contractor Billing</text>

  <!-- Tech Highlights Pills -->
  <g transform="translate(80, 275)">
    <rect width="120" height="32" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="60" y="21" fill="#38BDF8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Next.js 15</text>
  </g>
  <g transform="translate(210, 275)">
    <rect width="140" height="32" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="70" y="21" fill="#F59E0B" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Gantt Timelines</text>
  </g>
  <g transform="translate(360, 275)">
    <rect width="130" height="32" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="65" y="21" fill="#A855F7" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Redux Toolkit</text>
  </g>
  <g transform="translate(500, 275)">
    <rect width="130" height="32" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="65" y="21" fill="#34D399" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Ant Design</text>
  </g>

  <!-- Architectural Isometric Construction Illustration -->
  <g transform="translate(900, 110)">
    <!-- Base Foundation Block -->
    <polygon points="120,40 220,95 120,150 20,95" fill="#1E293B" stroke="#F59E0B" stroke-width="2"/>
    <polygon points="20,95 120,150 120,210 20,155" fill="#0F172A" stroke="#F59E0B" stroke-width="2"/>
    <polygon points="220,95 120,150 120,210 220,155" fill="#1E293B" stroke="#F59E0B" stroke-width="2"/>
    
    <!-- Upper Floor Block -->
    <polygon points="120,0 200,45 120,90 40,45" fill="#334155" stroke="#38BDF8" stroke-width="2"/>
    <polygon points="40,45 120,90 120,130 40,85" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
    <polygon points="200,45 120,90 120,130 200,85" fill="#334155" stroke="#38BDF8" stroke-width="2"/>

    <!-- Nodes & Gantt Connection Markers -->
    <circle cx="120" cy="0" r="6" fill="#F59E0B"/>
    <circle cx="200" cy="45" r="5" fill="#38BDF8"/>
    <circle cx="40" cy="45" r="5" fill="#38BDF8"/>
    <circle cx="120" cy="90" r="5" fill="#FFFFFF"/>
    <circle cx="120" cy="150" r="6" fill="#F59E0B"/>
    <circle cx="20" cy="95" r="5" fill="#38BDF8"/>
    <circle cx="220" cy="95" r="5" fill="#38BDF8"/>
    <circle cx="120" cy="210" r="5" fill="#F59E0B"/>
  </g>
</svg>
